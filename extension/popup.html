<!doctype html>
<html lang="es"><head><meta charset="utf-8">
<style>
body{font:13px system-ui,Segoe UI,sans-serif;width:300px;margin:0;padding:14px;color:#0f172a}
h1{font-size:14px;margin:0 0 10px}
.caja{border:1px solid #e2e8f0;border-radius:10px;padding:8px 10px;margin-bottom:8px}
.ok{color:#047857}.err{color:#b91c1c}.gris{color:#64748b;font-size:11px}
button,a.btn{display:block;width:100%;box-sizing:border-box;text-align:center;margin-top:6px;padding:7px;border-radius:8px;border:0;background:#0f172a;color:#fff;font-weight:700;cursor:pointer;text-decoration:none}
a.sec{background:#e2e8f0;color:#0f172a}
</style></head>
<body>
<h1>Legislación++ · Citaciones</h1>
<div class="caja"><b>Senado</b> <span class="gris">(automático cada 3 h)</span><div id="senado" class="gris">—</div>
<button id="sync">Sincronizar Senado ahora</button>
<a class="btn sec" href="https://www.senado.cl/actividad-legislativa/comisiones/citaciones" target="_blank">Abrir citaciones del Senado</a></div>
<div class="caja"><b>Sesiones del Senado</b> <span class="gris">(historial, cada 12 h)</span><div id="sesiones" class="gris">—</div>
<button id="syncSes">Sincronizar sesiones ahora</button></div>
<div class="caja"><b>Cámara</b> <span class="gris">(al abrir la página)</span><div id="camara" class="gris">—</div>
<a class="btn" href="https://www.camara.cl/legislacion/comisiones/citaciones_todas.aspx" target="_blank">Abrir citaciones de la Cámara</a>
<div class="gris" style="margin-top:4px">Abre la semana actual (y la siguiente si ya está publicada); se envía sola.</div></div>
<a class="btn sec" id="opc" href="#">Opciones (clave de importación)</a>
<script src="popup.js"></script>
</body></html>
