name: Deploy to GitHub Pages

# Desactivado: el sitio se sirve ahora desde Vercel (legistrack-cl.vercel.app),
# que si puede correr el backend (server/ vía api/[...all].ts). GitHub Pages solo
# sirve estatico y nunca pudo exponer /api/*, asi que se dejo de usar para evitar
# confusion sobre cual URL es la real. Se deja "workflow_dispatch" por si se
# necesita volver a activar manualmente en el futuro.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build Vite App
        run: npx vite build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
